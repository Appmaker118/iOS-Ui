name: Manual APK Generator

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Approot

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle (Generates wrapper if missing)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # --- DEBUG BUILD STEP ---
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: gradle assembleDebug

      # --- RELEASE BUILD STEPS ---
      - name: Decode Keystore File
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release-keystore.jks

      - name: Build Signed Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release-keystore.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      # --- UPLOAD ARTIFACT STEP ---
      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.build_type }}-APK
          path: |
            Approot/app/build/outputs/apk/debug/*.apk
            Approot/app/build/outputs/apk/release/*.apk
