name: Android APK Build Engine

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the source code repository
    - name: Checkout Code Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Set up the JDK 17 Environment cleanly
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Compile the application code directly using the runner's engine from your subfolder
    - name: Build Debug APK Layout
      run: |
        cd "Approot"
        gradle assembleDebug

    # 4. Extract and upload the finished APK artifact out of the build subdirectories
    - name: Upload Output APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-27-Replica-Debug-APK
        path: "**/build/outputs/apk/debug/app-debug.apk"
