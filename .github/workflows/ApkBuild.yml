name: Android APK Build Engine

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the source code repository
    - name: Checkout Code Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Set up the JDK 17 Environment cleanly
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Initialize Gradle structures inside the subfolder matching your project layout
    - name: Generate Fresh Gradle Wrapper
      run: |
        cd "Approot"
        gradle wrapper --gradle-version 8.2.2

    # 4. Grant absolute execution privileges to the newly generated wrapper
    - name: Grant Execute Permission for Gradle Wrapper
      run: |
        cd "Approot"
        chmod +x gradlew

    # 5. Compile the application code into a Debug APK from the subfolder
    - name: Build Debug APK Layout
      run: |
        cd "Approot"
        ./gradlew assembleDebug

    # 6. Extract and upload the finished APK artifact out of the build subdirectories
    - name: Upload Output APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-27-Replica-Debug-APK
        path: "**/build/outputs/apk/debug/app-debug.apk"
