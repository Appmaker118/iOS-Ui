name: Android APK Build Engine

# We have removed 'push' and 'pull_request' loops to protect your inbox
on:
  workflow_dispatch: # Allows you to manually trigger the build from the GitHub Actions tab whenever you want

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the source code from your repository explicitly
    - name: Checkout Code Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Set up the JDK 17 Environment cleanly
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Grant absolute execution privileges to the Gradle wrapper
    - name: Grant Execute Permission for Gradle Wrapper
      run: chmod +x gradlew

    # 4. Compile the application code into a Debug APK
    - name: Build Debug APK Layout
      run: ./gradlew assembleDebug

    # 5. Extract and upload the finished APK artifact
    - name: Upload Output APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-27-Replica-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
