name: Android APK Build Engine

on:
  workflow_dispatch: # Manual activation remains fully secure to protect your inbox

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the source code from your repository explicitly
    - name: Checkout Code Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Set up the JDK 17 Environment cleanly
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. GENERATE FRESH WRAPPER SCRIPTS LIVE ON THE ENGINE TO PREVENT 'NO SUCH FILE' ERRORS
    - name: Generate Fresh Gradle Wrapper
      run: gradle wrapper --gradle-version 8.2.2

    # 4. Grant absolute execution privileges to the newly generated wrapper
    - name: Grant Execute Permission for Gradle Wrapper
      run: chmod +x gradlew

    # 5. Compile the application code into a Debug APK
    - name: Build Debug APK Layout
      run: ./gradlew assembleDebug

    # 6. Extract and upload the finished APK artifact
    - name: Upload Output APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-27-Replica-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
