name: Android Apk Build

on:
  workflow_dispatch: # Locks down the build to only run manually when pressed in actions

jobs:
  build:
    # Pinned to ensure an OS environment change cannot break compilation mid-stream.
    runs-on: ubuntu-24.04
    env:
      # Signed release build when the signing secrets exist; debug build otherwise (e.g. forks).
      HAS_KEY: ${{ secrets.IOSUI_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Fix gradlew line endings and grant execute permission
        run: |
          cd "Approot"
          gradle wrapper --gradle-version 8.2.2
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build signed release APK
        if: env.HAS_KEY == 'true'
        env:
          IOSUI_KEYSTORE_B64: ${{ secrets.IOSUI_KEYSTORE_B64 }}
          IOSUI_KEYSTORE_PASSWORD: ${{ secrets.IOSUI_KEYSTORE_PASSWORD }}
          IOSUI_KEY_ALIAS: ${{ secrets.IOSUI_KEY_ALIAS }}
          IOSUI_KEY_PASSWORD: ${{ secrets.IOSUI_KEY_PASSWORD }}
        run: |
          cd "Approot"
          echo "$IOSUI_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/iosui-release.jks"
          export IOSUI_KEYSTORE_PATH="$RUNNER_TEMP/iosui-release.jks"
          ./gradlew assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/iosui-release.jks"

      - name: Upload release APK
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-release-apk
          path: Approot/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Build debug APK (no signing key configured)
        if: env.HAS_KEY != 'true'
        run: |
          cd "Approot"
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        if: env.HAS_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-debug-apk
          path: Approot/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
