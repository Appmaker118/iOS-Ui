name: iOS UI

on:
  workflow_dispatch: # Locks down the build to only run manually when pressed in actions

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HAS_KEY: ${{ secrets.IOSUI_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # FORCE RESET SYSTEM STRUCTURES ON THE RUNNER VM INSTANCE
      - name: Reconstruct Rigid Standard Project Layout
        run: |
          # 1. Completely blow away any residual folder or cache configuration collisions
          rm -rf Approot/build.gradle Approot/settings.gradle Approot/gradle.properties Approot/app/build.gradle
          
          # 2. Re-create the standard project directory trees explicitly
          mkdir -p Approot/app/src/main
          
          # 3. Write standard root-level settings file
          cat << 'EOF' > Approot/settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "iOS-Ui-Replica"
          include ':app'
          EOF

          # 4. Write standard root-level build script carrying only global classpath hooks
          cat << 'EOF' > Approot/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.4.0' }
          }
          plugins {
              id 'com.android.application' version '8.4.0' apply false
          }
          tasks.register('clean', Delete) { delete rootProject.buildDir }
          EOF

          # 5. Write explicit system properties
          cat << 'EOF' > Approot/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 6. Generate explicit app-module build script with absolute namespace mapping
          cat << 'EOF' > Approot/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.replica.iosui'
              compileSdk 34
              defaultConfig {
                  applicationId "com.replica.iosui"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.cardview:cardview:1.0.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.viewpager2:viewpager2:1.0.0'
          }
          EOF

          # 7. Write a clean AndroidManifest with required XML namespaces
          cat << 'EOF' > Approot/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com"
              xmlns:tools="http://android.com">
              
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="iOS 27 UI"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  tools:node="replace">
                  <activity
                      android:name="com.replica.iosui.MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:clearTaskOnLaunch="true"
                      android:stateNotNeeded="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
                  <service android:name="com.replica.iosui.services.IOSStatusBarService" android:enabled="true" android:exported="false" />
                  <service android:name="com.replica.iosui.services.IOSLockScreenService" android:enabled="true" android:exported="false" />
              </application>
          </manifest>
          EOF

      - name: Initialize Fresh Gradle Wrapper
        run: |
          cd Approot
          gradle wrapper --gradle-version 8.7
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build signed release APK
        if: env.HAS_KEY == 'true'
        env:
          IOSUI_KEYSTORE_B64: ${{ secrets.IOSUI_KEYSTORE_B64 }}
          IOSUI_KEYSTORE_PASSWORD: ${{ secrets.IOSUI_KEYSTORE_PASSWORD }}
          IOSUI_KEY_ALIAS: ${{ secrets.IOSUI_KEY_ALIAS }}
          IOSUI_KEY_PASSWORD: ${{ secrets.IOSUI_KEY_PASSWORD }}
        run: |
          cd Approot
          echo "$IOSUI_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/iosui-release.jks"
          export IOSUI_KEYSTORE_PATH="$RUNNER_TEMP/iosui-release.jks"
          ./gradlew assembleRelease --no-daemon --stacktrace
          rm -f "$RUNNER_TEMP/iosui-release.jks"

      - name: Upload release APK artifact
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-release-apk
          path: Approot/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Build debug APK (no signing key configured)
        if: env.HAS_KEY != 'true'
        run: |
          cd Approot
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        if: env.HAS_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
