name: iOS UI

on:
  workflow_dispatch: # Locks down the build to only run manually when pressed in actions

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Approot
    env:
      HAS_KEY: ${{ secrets.IOSUI_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize Fresh Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Deep Clean Cache Corruption
        run: |
          ./gradlew clean --no-daemon
          rm -rf ~/.gradle/caches/
          rm -rf .gradle/
          rm -rf app/build/
          rm -rf build/

      # Injects tools:node="replace" on the application tag to aggressively isolate our parameters from background conflicts
      - name: Force Overwrite Live Manifest
        run: |
          mkdir -p app/src/main
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com"
              xmlns:tools="http://android.com">

              <uses-sdk tools:overrideLibrary="androidx.appcompat, com.google.android.material, androidx.cardview, androidx.recyclerview, androidx.viewpager2"/>

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="iOS 27 UI"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  tools:node="replace">

                  <activity
                      android:name="com.replica.iosui.MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:clearTaskOnLaunch="true"
                      android:stateNotNeeded="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name="com.replica.iosui.services.IOSStatusBarService"
                      android:enabled="true"
                      android:exported="false" />

                  <service
                      android:name="com.replica.iosui.services.IOSLockScreenService"
                      android:enabled="true"
                      android:exported="false" />

              </application>
          </manifest>
          EOF

      - name: Build signed release APK
        if: env.HAS_KEY == 'true'
        env:
          IOSUI_KEYSTORE_B64: ${{ secrets.IOSUI_KEYSTORE_B64 }}
          IOSUI_KEYSTORE_PASSWORD: ${{ secrets.IOSUI_KEYSTORE_PASSWORD }}
          IOSUI_KEY_ALIAS: ${{ secrets.IOSUI_KEY_ALIAS }}
          IOSUI_KEY_PASSWORD: ${{ secrets.IOSUI_KEY_PASSWORD }}
        run: |
          echo "$IOSUI_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/iosui-release.jks"
          export IOSUI_KEYSTORE_PATH="$RUNNER_TEMP/iosui-release.jks"
          ./gradlew assembleRelease --no-daemon --stacktrace
          rm -f "$RUNNER_TEMP/iosui-release.jks"

      - name: Upload release APK artifact
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-release-apk
          path: Approot/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Build debug APK (no signing key configured)
        if: env.HAS_KEY != 'true'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        if: env.HAS_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
