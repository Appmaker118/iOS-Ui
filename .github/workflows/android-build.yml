name: iOS UI

on:
  workflow_dispatch: # Only runs when you press the button manually in Actions

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HAS_KEY: ${{ secrets.IOSUI_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # AUTO-LOCATE AND AUTO-RECONSTRUCT THE WORKSPACE STAGING GROUND
      - name: Auto-Locate and Rebuild Project Structure
        run: |
          echo "🔍 Scanning repository for your Android source files..."
          
          # Find where the actual main project source folder lives inside the repo dynamically
          SRC_PATH=$(find . -type d -path "*/src/main" -print -quit)
          
          if [ -z "$SRC_PATH" ]; then
            echo "❌ CRITICAL ERROR: Could not find a 'src/main' folder anywhere in this repository."
            exit 1
          fi
          
          echo "🎯 Found your project source folder at: $SRC_PATH"
          
          # Wipe out any residual staging directories
          rm -rf clean_workspace
          
          # Reconstruct a completely pristine, standard Android layout structure
          mkdir -p clean_workspace/app/src/main
          
          # Copy your raw source files exactly into the new clean workspace layout
          cp -r "$SRC_PATH"/. clean_workspace/app/src/main/
          
          # Generate a standard, modern root-level settings file
          cat << 'EOF' > clean_workspace/settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "iOS-Ui-Replica"
          include ':app'
          EOF

          # Generate a standard root-level build controller
          cat << 'EOF' > clean_workspace/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.4.0' }
          }
          plugins {
              id 'com.android.application' version '8.4.0' apply false
          }
          tasks.register('clean', Delete) { delete rootProject.buildDir }
          EOF

          # Generate required system architecture properties
          cat << 'EOF' > clean_workspace/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # Generate standard app-module build dependencies rules with clear package namespaces
          cat << 'EOF' > clean_workspace/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.replica.iosui'
              compileSdk 34
              defaultConfig {
                  applicationId "com.replica.iosui"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.cardview:cardview:1.0.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.viewpager2:viewpager2:1.0.0'
          }
          EOF

          # 🚀 FIXED: Completely overwrite the manifest directly on the staging ground.
          # This replaces matching commands with a fully-validated manifest schema.
          cat << 'EOF' > clean_workspace/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com"
              xmlns:tools="http://android.com">

              <uses-sdk tools:overrideLibrary="androidx.appcompat, com.google.android.material, androidx.cardview, androidx.recyclerview, androidx.viewpager2"/>

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" tools:ignore="ProtectedPermissions" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="iOS 27 UI"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  tools:node="replace">

                  <activity
                      android:name="com.replica.iosui.MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:clearTaskOnLaunch="true"
                      android:stateNotNeeded="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name="com.replica.iosui.services.IOSStatusBarService"
                      android:enabled="true"
                      android:exported="false" />

                  <service
                      android:name="com.replica.iosui.services.IOSLockScreenService"
                      android:enabled="true"
                      android:exported="false" />

              </application>
          </manifest>
          EOF
          echo "✨ Pristine standalone manifest safely injected!"

      - name: Initialize Fresh Gradle Wrapper
        run: |
          cd clean_workspace
          gradle wrapper --gradle-version 8.7
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build signed release APK
        if: env.HAS_KEY == 'true'
        env:
          IOSUI_KEYSTORE_B64: ${{ secrets.IOSUI_KEYSTORE_B64 }}
          IOSUI_KEYSTORE_PASSWORD: ${{ secrets.IOSUI_KEYSTORE_PASSWORD }}
          IOSUI_KEY_ALIAS: ${{ secrets.IOSUI_KEY_ALIAS }}
          IOSUI_KEY_PASSWORD: ${{ secrets.IOSUI_KEY_PASSWORD }}
        run: |
          cd clean_workspace
          echo "$IOSUI_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/iosui-release.jks"
          export IOSUI_KEYSTORE_PATH="$RUNNER_TEMP/iosui-release.jks"
          ./gradlew assembleRelease --no-daemon --stacktrace
          rm -f "$RUNNER_TEMP/iosui-release.jks"

      - name: Upload release APK artifact
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-release-apk
          path: clean_workspace/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Build debug APK (no signing key configured)
        if: env.HAS_KEY != 'true'
        run: |
          cd clean_workspace
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        if: env.HAS_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
