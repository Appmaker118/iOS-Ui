name: iOS UI

on:
  workflow_dispatch: # Strictly runs only when you press the button manually in Actions

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Approot # Directs all commands to execute inside your project folder
    env:
      HAS_KEY: ${{ secrets.IOSUI_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize Fresh Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build signed release APK
        if: env.HAS_KEY == 'true'
        env:
          IOSUI_KEYSTORE_B64: ${{ secrets.IOSUI_KEYSTORE_B64 }}
          IOSUI_KEYSTORE_PASSWORD: ${{ secrets.IOSUI_KEYSTORE_PASSWORD }}
          IOSUI_KEY_ALIAS: ${{ secrets.IOSUI_KEY_ALIAS }}
          IOSUI_KEY_PASSWORD: ${{ secrets.IOSUI_KEY_PASSWORD }}
        run: |
          echo "$IOSUI_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/iosui-release.jks"
          export IOSUI_KEYSTORE_PATH="$RUNNER_TEMP/iosui-release.jks"
          ./gradlew assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/iosui-release.jks"

      - name: Upload release APK artifact
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-release-apk
          path: Approot/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Build debug APK (no signing key configured)
        if: env.HAS_KEY != 'true'
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        if: env.HAS_KEY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-debug-apk
          path: Approot/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
